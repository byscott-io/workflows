# Centralized Claude PR review — single source of truth for the whole fleet.
# Repos call this via a thin caller:
#
#   jobs:
#     review:
#       uses: byscott-io/workflows/.github/workflows/claude-pr-review.yml@master
#       secrets:
#         ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
#         CLAUDE_APP_ID:          ${{ secrets.CLAUDE_APP_ID }}
#         CLAUDE_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
#
# Public repo so both public and private fleet repos can call it. Edit the prompt
# / skip rules / strictness here → every repo updates. No secrets stored here.
# Auth is a GitHub App installation token (bot identity): required for formal
# Approve/Request-changes (a user can't review their own PR) and works under the
# enterprise's read-only GITHUB_TOKEN (token derives from the app key, not the
# workflow token — so we declare only contents:read).
name: Claude PR Review (reusable)

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      CLAUDE_APP_ID:
        required: true
      CLAUDE_APP_PRIVATE_KEY:
        required: true

jobs:
  review:
    # Central skip rules: never review draft PRs or Dependabot dep-bump PRs.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      # Defer the review until the PR's OTHER checks (CI: rspec, rubocop, etc.)
      # have settled, so Claude reads real CI conclusions rather than "pending".
      # Excludes this review's own check to avoid waiting on itself; bounded so a
      # stuck check can't hang the job (it proceeds and reports whatever exists).
      - name: Wait for CI to finish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for i in $(seq 1 45); do
            pending=$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name,state \
              --jq '[.[] | select((.name | test("Claude"; "i") | not)
                     and (.state | test("pending|queued|in_progress|waiting")))] | length' \
              2>/dev/null || echo 0)
            echo "iter $i: $pending non-Claude checks still running"
            [ "$pending" = "0" ] && { echo "CI settled"; break; }
            sleep 20
          done

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          track_progress: "true"
          # Sonnet for predictable review cost; generous-but-bounded turn cap.
          claude_args: "--model claude-sonnet-5 --max-turns 40"
          prompt: |
            Review this pull request for a Rails + React application in the ByScott fleet.
            First read the repository's CLAUDE.md and honor its project-specific rules.

            IMPORTANT — this review runs in a GitHub Actions sandbox: you generally
            CANNOT run the project's test or lint suites (bundle exec rspec / rubocop,
            yarn) and cannot fetch other branches. Do NOT attempt them, and do NOT
            report "couldn't run specs/rubocop" as a gap. For test / lint / build
            status, read the PR's ALREADY-RUN CI results instead — e.g.
            `gh pr checks <number>` or the checks API (you have a token) — and treat
            those conclusions as the source of truth, calling out any failing check.

            Report only real, actionable issues — do NOT nitpick style that RuboCop /
            ESLint already enforce, and don't invent problems. Prioritize in this order:

            1. Correctness & bugs — logic errors, unhandled edge cases, nil handling,
               race conditions, and anything risking data loss or a bad migration.
            2. Security — authn/authz gaps, injection, unsafe params, secret/PII
               exposure, and cross-account / multi-tenant leakage.
            3. Tests — is the new behavior covered by RSpec specs? Flag missing or weak
               coverage; for bug fixes, prefer a fail-then-pass proof spec.
            4. Fleet conventions (from CLAUDE.md) — keep code DRY; React over raw HTML;
               modals over separate form pages; RSpec over Minitest.

            Be concise: a one-line summary of the change, then findings ranked
            most-severe first, each with file:line and a concrete suggested fix. If the
            PR is clean, say so briefly instead of manufacturing findings.

            Then CONCLUDE by submitting a FORMAL pull-request review (not just a
            comment) via `gh pr review <number>` with your write-up as the body.
            Apply the "${{ contains(fromJSON('["lenient","moderate","strict"]'), vars.CLAUDE_REVIEW_STRICTNESS) && vars.CLAUDE_REVIEW_STRICTNESS || 'moderate' }}" strictness level (unrecognized/empty falls back to moderate):
              - lenient  : --request-changes ONLY for an outright correctness/security
                           bug or data-loss risk; otherwise --approve.
              - moderate : --request-changes for a correctness/security bug,
                           data-loss/migration risk, OR new behavior with NO test
                           coverage; --approve if only nits/polish remain.
              - strict   : everything in moderate, PLUS weak/partial coverage or
                           convention violations also warrant --request-changes.
            Use --comment only when genuinely uncertain or notes are informational.
            This is advisory (branch protection does not require it), so prefer
            --approve for non-blocking issues and reserve --request-changes for things
            that genuinely should block a merge.
