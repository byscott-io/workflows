# Centralized Claude PR review — single source of truth for the whole fleet.
# Repos call this via a thin caller:
#
#   jobs:
#     review:
#       uses: byscott-io/workflows/.github/workflows/claude-pr-review.yml@master
#       secrets:
#         ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
#         CLAUDE_APP_ID:          ${{ secrets.CLAUDE_APP_ID }}
#         CLAUDE_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
#         METRICSBYSCOTT_API_KEY: ${{ secrets.METRICSBYSCOTT_API_KEY }}
#
# The last one is optional and pass it anyway: without it a review's cost
# reaches the job summary and the PR but has no history. It resolves empty in a
# repo that holds no such secret, which the cost action treats as "no key".
#
# NOTE: pull_request uses the workflow file from the PR's HEAD branch, so the
# caller must exist on that branch (branch from up-to-date master).
# Public repo so both public and private fleet repos can call it. Edit the
# prompt / skip rules / strictness here → every repo updates. No secrets stored.
# Auth is a GitHub App installation token (bot identity): needed for formal
# Approve/Request-changes (a user can't review their own PR) and works under the
# enterprise read-only GITHUB_TOKEN (we declare only contents:read).
#
# The allowlist is ALSO spelled out in the prompt. It is not belt-and-braces: a
# reviewer that cannot see the boundary probes it, and three runs on 2026-10-10
# spent 11, 13 and 16 of 40 turns on refused calls, two of them exhausting the
# budget before any verdict was submitted. Turns were raised to 60 for headroom,
# but naming the boundary is what stops the waste. Widen BOTH together.
# claude-code-action has NO native formal-review input and DISABLES Bash by
# default, so the model can't run `gh pr review` unless we allow it. IMPORTANT:
# --allowedTools REPLACES the default allowlist, so every tool the review needs
# must be listed here.
name: Claude PR Review (reusable)

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      CLAUDE_APP_ID:
        required: true
      CLAUDE_APP_PRIVATE_KEY:
        required: true
      # Optional. Pass it and each review's cost is recorded in metricsbyscott
      # as a claude_review.completed event; omit it and the cost still lands in
      # the run's job summary, just without history.
      METRICSBYSCOTT_API_KEY:
        required: false

jobs:
  review:
    # Central skip rules: never review draft PRs or Dependabot dep-bump PRs.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      # Defer the review until the PR's OTHER checks (CI) have both APPEARED and
      # settled, so Claude reads real CI conclusions. First wait for a non-Claude
      # check to register (avoids the open-race where none exist yet), then wait
      # for them to finish. Bounded so a stuck/absent check can't hang the job.
      - name: Wait for CI to finish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # give CI a moment to register its checks
          for i in $(seq 1 6); do
            n=$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name \
              --jq '[.[]|select(.name|test("Claude";"i")|not)]|length' 2>/dev/null || echo 0)
            [ "$n" != "0" ] && break
            echo "waiting for CI checks to appear ($i)"; sleep 10
          done
          for i in $(seq 1 45); do
            pending=$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name,state \
              --jq '[.[] | select((.name | test("Claude"; "i") | not)
                     and (.state | test("pending|queued|in_progress|waiting")))] | length' \
              2>/dev/null || echo 0)
            echo "iter $i: $pending non-Claude checks still running"
            [ "$pending" = "0" ] && { echo "CI settled"; break; }
            sleep 20
          done

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: '--model claude-sonnet-5 --max-turns 60 --allowedTools "Read,Grep,Glob,Bash(gh pr *)"'
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }} for a
            Rails + React application in the ByScott fleet.

            TOOLS — this is the entire allowlist, and anything outside it is refused
            and costs a turn. Runs have died at the turn limit with NO verdict posted
            after spending a quarter of the budget on refused calls, so treat this as
            a hard boundary rather than something to probe:
              - Bash, but ONLY a command starting with "gh pr " — gh pr diff, checks,
                view, review. NOT gh api, NOT git, NOT cat/ls/sed/wc/head, and NO pipe
                or redirection: "gh pr diff N | head" is refused as a whole command.
              - Read, Grep, Glob, over the repo, which is checked out beside you.
            Budget accordingly: take the diff ONCE, then Read only the files you must.

            Gather context yourself:
            - `gh pr diff ${{ github.event.pull_request.number }}` — the change
            - `gh pr checks ${{ github.event.pull_request.number }}` — CI results, the
              SOURCE OF TRUTH for test/lint/build. Do NOT run rspec/rubocop/yarn yourself
              (the sandbox can't) and do NOT report that as a gap; just call out any
              failing check.
            - read CLAUDE.md and any files you need via Read/Grep/Glob, and honor the
              repo's project-specific rules.
            - if `.github/claude-review.md` exists in this repo, read it and apply its
              items as ADDITIONAL, repo-specific review checks (e.g. this repo's
              deploy/release checklist) ON TOP of the standard checks below. Report on
              each of its items explicitly.

            Report only real, actionable issues — don't nitpick what RuboCop/ESLint
            enforce, don't invent problems — prioritized:
            1. Correctness & bugs   2. Security   3. Tests (RSpec coverage of new
            behavior; prefer a fail-then-pass proof for bug fixes)   4. Fleet
            conventions from CLAUDE.md (DRY; React over raw HTML; modals over form pages).

            Then you MUST submit a FORMAL review by actually RUNNING this command (a
            comment is not enough — run it, don't just describe it):

              gh pr review ${{ github.event.pull_request.number }} --<decision> --body "<your review>"

            Choose <decision> per the "${{ contains(fromJSON('["lenient","moderate","strict"]'), vars.CLAUDE_REVIEW_STRICTNESS) && vars.CLAUDE_REVIEW_STRICTNESS || 'moderate' }}" strictness level (unrecognized/empty → moderate):
              - lenient  : "request-changes" ONLY for an outright correctness/security bug
                           or data-loss risk; otherwise "approve".
              - moderate : "request-changes" for a correctness/security bug,
                           data-loss/migration risk, OR new behavior with NO test
                           coverage; otherwise "approve".
              - strict   : moderate PLUS weak/partial coverage or convention violations
                           also warrant "request-changes".
            Use "comment" only when genuinely uncertain. This is advisory (branch
            protection does not require it), so prefer "approve" for non-blocking issues.
            Put a one-line summary + ranked findings (file:line + concrete fix) in --body.

      # What did this review cost? -> the job summary, the review body itself,
      # and metricsbyscott when a key is supplied.
      #
      # Referenced by full repo path, NOT `./.github/actions/...`: in a called
      # workflow a relative action path resolves against the CALLER's checkout,
      # so `./` would look for this action in corebyscott and fail.
      #
      # Never allowed to affect the review: runs even when the review failed,
      # and any error is swallowed. A cost report is not worth a red X on a
      # review that actually succeeded.
      - name: Report review cost
        if: always()
        continue-on-error: true
        uses: byscott-io/workflows/.github/actions/report-claude-cost@master
        with:
          execution_file: ${{ steps.claude.outputs.execution_file }}
          conclusion: ${{ steps.claude.outputs.conclusion }}
          github_token: ${{ steps.app-token.outputs.token }}
          pr_number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          metrics_key: ${{ secrets.METRICSBYSCOTT_API_KEY }}
