# Centralized interactive Claude — responds to @claude mentions on issues/PRs.
# On a PR it ALWAYS submits a FORMAL review (Approve/Request-changes), regardless
# of how the comment is phrased — the formal directive is in the prompt (a system
# prompt alone wasn't decisive; the user-turn wording was). Callers trigger on
# comment events + guard on '@claude'. Auth via a GitHub App token (bot identity).
# Bash is disabled by default in claude-code-action, so --allowedTools (which
# REPLACES the default allowlist) grants the gh tool needed to run gh pr review.
# The allowlist is ALSO spelled out in the prompt. It is not belt-and-braces: a
# reviewer that cannot see the boundary probes it, and three runs on 2026-10-10
# spent 11, 13 and 16 of 40 turns on refused calls, two of them exhausting the
# budget before any verdict was submitted. Turns were raised to 60 for headroom,
# but naming the boundary is what stops the waste. Widen BOTH together.
name: Claude Mention (reusable)

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      CLAUDE_APP_ID:
        required: true
      CLAUDE_APP_PRIVATE_KEY:
        required: true
      # Optional. Pass it and each run's cost is recorded in metricsbyscott as
      # a claude_review.completed event; omit it and the cost still reaches the
      # job summary and the PR, just without history.
      METRICSBYSCOTT_API_KEY:
        required: false

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: '--model claude-sonnet-5 --max-turns 60 --allowedTools "Read,Grep,Glob,Bash(gh pr *)"'
          prompt: |
            You were mentioned with @claude on #${{ github.event.issue.number || github.event.pull_request.number }}
            (${{ (github.event.issue.pull_request || github.event.pull_request) && 'a PULL REQUEST' || 'an ISSUE' }})
            by a write-access user. Their comment:

            ---
            ${{ github.event.comment.body }}
            ---

            TOOLS — this is the entire allowlist, and anything outside it is refused
            and costs a turn. Runs have died at the turn limit with NO verdict posted
            after spending a quarter of the budget on refused calls, so treat this as
            a hard boundary rather than something to probe:
              - Bash, but ONLY a command starting with "gh pr " — gh pr diff, checks,
                view, review. NOT gh api, NOT git, NOT cat/ls/sed/wc/head, and NO pipe
                or redirection: "gh pr diff N | head" is refused as a whole command.
              - Read, Grep, Glob, over the repo, which is checked out beside you.
            Budget accordingly: take the diff ONCE, then Read only the files you must.

            Do what they ask. BUT if this is a PULL REQUEST you MUST ALWAYS finish by
            submitting a FORMAL review — regardless of how the comment is phrased, even if
            it just says "review" or nothing specific. A posted comment is NOT enough; the
            formal review object must be created by actually RUNNING:

              gh pr review ${{ github.event.issue.number || github.event.pull_request.number }} --<decision> --body "<your write-up>"

            To review: read the diff via
            `gh pr diff ${{ github.event.issue.number || github.event.pull_request.number }}`
            and CI via
            `gh pr checks ${{ github.event.issue.number || github.event.pull_request.number }}`
            (CI is the source of truth for tests/lint/build — do NOT run rspec/rubocop/yarn
            yourself and do NOT report that as a gap; flag any failing check). Read CLAUDE.md
            and, if present, .github/claude-review.md, and apply its items as ADDITIONAL
            repo-specific checks (report on each). Report only real issues (correctness,
            security, RSpec coverage of new behavior, fleet conventions), most-severe first
            with file:line and a concrete fix.

            Choose <decision> at MODERATE strictness: "request-changes" for a
            correctness/security bug, data-loss/migration risk, or new behavior with NO test
            coverage; otherwise "approve"; use "comment" only if genuinely uncertain. This is
            advisory (branch protection does not require it).

            If this is a plain ISSUE (not a pull request), just respond to the request
            normally — no formal review needed.

      # This workflow reported NO cost at all until now, which mattered more
      # than it sounds: a PR that goes more than one round gets its first
      # review from claude-pr-review and every re-review from here, so most
      # reviews on a contested PR were unmeasured.
      #
      # On a PR the cost is appended to the review just submitted; on an issue,
      # where there is no review, it is posted as a comment.
      - name: Report run cost
        if: always()
        continue-on-error: true
        uses: byscott-io/workflows/.github/actions/report-claude-cost@master
        with:
          execution_file: ${{ steps.claude.outputs.execution_file }}
          conclusion: ${{ steps.claude.outputs.conclusion }}
          github_token: ${{ steps.app-token.outputs.token }}
          pr_number: ${{ github.event.issue.number || github.event.pull_request.number }}
          repo: ${{ github.repository }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          metrics_key: ${{ secrets.METRICSBYSCOTT_API_KEY }}
